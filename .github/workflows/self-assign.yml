name: Self-assign issues

# Comment "request" (or "/request" or "/assign") on an issue to assign it to yourself.
# Comment "/unassign" to remove yourself.
# The comment must contain ONLY that word, so that sentences like "pull request"
# never trigger it.

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  assign:
    # Only on issues (not on pull requests) and never for bots
    if: ${{ !github.event.issue.pull_request && github.event.comment.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const user = context.payload.comment.user.login;
            const text = (context.payload.comment.body || '').trim().toLowerCase();

            const wantsAssign = ['request', '/request', '/assign'].includes(text);
            const wantsUnassign = text === '/unassign';
            if (!wantsAssign && !wantsUnassign) return;

            if (wantsAssign) {
              await github.rest.issues.addAssignees({
                owner, repo, issue_number, assignees: [user],
              });
            } else {
              await github.rest.issues.removeAssignees({
                owner, repo, issue_number, assignees: [user],
              });
            }

            await github.rest.reactions.createForIssueComment({
              owner, repo,
              comment_id: context.payload.comment.id,
              content: '+1',
            });
