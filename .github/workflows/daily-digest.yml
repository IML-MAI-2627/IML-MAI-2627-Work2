name: Daily digest

on:
  schedule:
    - cron: "0 7 * * 1-5"   # 07:00 UTC = 09:00 Spanish summer time (until 25 Oct); 08:00 afterwards
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const DAY = 86400000;
            const now = new Date();
            const body = [];      // full summary (stored in the "Team digest" issue, no notifications)
            const urgent = [];    // alerts with @mentions (only posted when something needs action)

            // ---------- Open pull requests ----------
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            body.push('## Open pull requests');
            if (!prs.length) body.push('_None._');
            for (const pr of prs) {
              const idle = Math.floor((now - new Date(pr.updated_at)) / DAY);
              const reviewers = pr.requested_reviewers.map(r => r.login);
              const draft = pr.draft ? ' (draft)' : '';
              let note = '';
              if (!pr.draft) {
                note += reviewers.length
                  ? ` · awaiting review from: ${reviewers.join(', ')}`
                  : ' · no reviewer assigned';
              }
              if (idle >= 2) note += ` · ${idle} days without activity`;
              body.push(`- #${pr.number} ${pr.title} — author: ${pr.user.login}${draft}${note}`);

              if (!pr.draft && idle >= 2) {
                const who = [pr.user.login, ...reviewers].map(l => '@' + l).join(' ');
                urgent.push(`- PR #${pr.number} has had no activity for ${idle} days: ${who}`);
              }
            }

            // ---------- Milestones ----------
            const milestones = (await github.paginate(github.rest.issues.listMilestones, {
              owner, repo, state: 'open', per_page: 100,
            })).filter(m => m.due_on)
               .sort((a, b) => new Date(a.due_on) - new Date(b.due_on));

            body.push('', '## Milestones');
            for (const [i, m] of milestones.entries()) {
              const daysLeft = Math.ceil((new Date(m.due_on) - now) / DAY);
              const soon = daysLeft <= 2;          // includes overdue (negative)
              if (i > 0 && !soon) continue;        // details only for the next one or those due very soon

              const issues = (await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, milestone: m.number, state: 'open', per_page: 100,
              })).filter(it => !it.pull_request);

              const when = daysLeft < 0 ? `overdue by ${-daysLeft} days`
                         : daysLeft === 0 ? 'due today'
                         : `due in ${daysLeft} days`;
              body.push(`### ${m.title} (${m.due_on.slice(0, 10)}, ${when}) — ${issues.length} open`);
              for (const it of issues) {
                const who = it.assignees.map(a => a.login).join(', ') || 'unassigned';
                body.push(`- #${it.number} ${it.title} — ${who}`);
              }

              if (soon && issues.length) {
                const mentions = [...new Set(issues.flatMap(it => it.assignees.map(a => '@' + a.login)))];
                urgent.push(
                  `- Milestone **${m.title}** ${when}: ${issues.length} issues still open ` +
                  `(${issues.map(it => '#' + it.number).join(', ')}) ${mentions.join(' ')}`
                );
              }
            }

            const header = `_Updated: ${now.toISOString().slice(0, 16).replace('T', ' ')} UTC_\n\n`;
            const text = header + body.join('\n');

            // ---------- Pinned "Team digest" issue ----------
            const label = 'digest';
            const found = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, labels: label, state: 'open', per_page: 10,
            });
            let issue = found.find(i => !i.pull_request);
            if (issue) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body: text });
            } else {
              try {
                await github.rest.issues.createLabel({ owner, repo, name: label, color: 'ededed' });
              } catch (e) { /* already exists */ }
              const r = await github.rest.issues.create({
                owner, repo, title: 'Team digest (automated)', body: text, labels: [label],
              });
              issue = r.data;
            }

            // ---------- Alert with @mentions only if something needs action ----------
            if (urgent.length) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Attention (${now.toISOString().slice(0, 10)}):\n\n${urgent.join('\n')}`,
              });
            }
