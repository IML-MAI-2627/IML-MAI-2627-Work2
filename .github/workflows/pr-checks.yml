name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  linked-issue:
    # Fails if the PR description does not link an issue (Closes #n, Related to #n, ...).
    # Do NOT mark it as "required" in the branch protection of main: it is a visible warning, not a blocker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.user.type === 'Bot') return;
            const body = pr.body || '';
            const ok = /\b(close[sd]?|fix(e[sd])?|resolve[sd]?|related to|refs?)\s+#\d+/i.test(body);
            if (!ok) {
              core.setFailed('The PR description does not link any issue. Add e.g. "Closes #12" or "Related to #12".');
            }

  labels:
    runs-on: ubuntu-latest
    steps:
      # Labels by changed folder
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

      # Size label (S/M/L) based on changed lines
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const total = pr.additions + pr.deletions;
            const size = total < 50 ? 'size/S' : total < 250 ? 'size/M' : 'size/L';
            const colors = { 'size/S': '0e8a16', 'size/M': 'fbca04', 'size/L': 'b60205' };

            for (const [name, color] of Object.entries(colors)) {
              try {
                await github.rest.issues.createLabel({ owner, repo, name, color });
              } catch (e) { /* already exists */ }
            }

            const current = pr.labels.map(l => l.name);
            for (const name of Object.keys(colors)) {
              if (name !== size && current.includes(name)) {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: pr.number, name,
                });
              }
            }
            if (!current.includes(size)) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr.number, labels: [size],
              });
            }
